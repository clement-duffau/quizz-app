<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Culture</title>
<meta name="mq-title" content="Quiz Culture">
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<script src="../../shared/capacitor.js"></script>
<script src="../../shared/shell.js"></script>
<style>
:root{--bg:#EEF0FF;--surface:#FFFFFF;--ink:#19164A;--muted:#5F5C8F;--primary:#3B2EF0;--sun:#FFC93C;--pink:#FF4D8D;--good:#14A862;--bad:#E8392F;--line:#D6D8F5;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110F38;--surface:#1D1957;--ink:#F3F2FF;--muted:#A9A6DA;--primary:#6F64FF;--line:#2F2A78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#110F38;--surface:#1D1957;--ink:#F3F2FF;--muted:#A9A6DA;--primary:#6F64FF;--line:#2F2A78;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:640px;margin:0 auto;padding:24px 18px 48px}
.screen{display:none}
.screen.on{display:block;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Tuiles de lettres : l'élément signature */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;perspective:600px;margin:10px 0 18px}
.tile{width:clamp(40px,12vw,70px);height:clamp(52px,15vw,84px);display:grid;place-items:center;background:var(--primary);color:#fff;font-weight:800;font-size:clamp(26px,7.5vw,46px);border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.28);animation:flip .55s cubic-bezier(.3,1.5,.5,1) both}
.tile:nth-child(3n+2){background:var(--pink)}
.tile:nth-child(3n){background:var(--sun);color:#19164A}
.tile.gap{background:none;box-shadow:none;width:14px}
@keyframes flip{from{transform:rotateX(95deg) translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.tiles.party .tile{animation:hop .5s ease both}
@keyframes hop{50%{transform:translateY(-14px) rotate(-6deg)}}

/* Accueil */
.hero{text-align:center;padding-top:12px}
.hero p{color:var(--muted);margin:0 auto 28px;max-width:34ch;font-size:1.05rem}
.modes{display:grid;gap:14px}
.mode{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-2px);border-color:var(--primary)}
.mode:active{transform:scale(.98)}
.mode .emo{font-size:2rem}
.mode strong{display:block;font-size:1.2rem}
.mode span{color:var(--muted);font-size:.92rem}
.mode .best{font-weight:800;color:var(--primary);font-size:.95rem;text-align:right;white-space:nowrap}

/* Jeu */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.hud .score{font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.streak{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);transition:transform .2s}
.streak.hot{border-color:var(--pink);color:var(--pink);animation:pulse .6s ease}
@keyframes pulse{50%{transform:scale(1.18)}}
.quit{background:none;border:0;color:var(--muted);padding:4px;font-size:.95rem}
.dots{display:flex;gap:5px;margin-bottom:12px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.ko{background:var(--bad)}.dots i.now{background:var(--primary)}
.timer{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-bottom:18px}
.timer i{display:block;height:100%;width:100%;background:var(--sun);border-radius:5px}
.timer.low i{background:var(--bad)}
.card{background:var(--surface);border-radius:22px;padding:20px 18px 22px;border:2px solid var(--line);position:relative}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.cat{font-size:.9rem;color:var(--muted);font-weight:600;text-align:center}
.q{font-size:clamp(1.25rem,4.6vw,1.6rem);font-weight:800;text-align:center;margin:6px 0 18px;line-height:1.25}
.cg-emo{font-size:3rem;text-align:center;display:block;animation:flip .55s cubic-bezier(.3,1.5,.5,1) both}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1.02rem;font-weight:600;transition:transform .12s,background .2s,border-color .2s,opacity .2s;animation:enter .3s ease both}
.choice:hover:not(:disabled){border-color:var(--primary);transform:translateX(3px)}
.choice .k{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:.9rem}
.choice:disabled{cursor:default}
.choice.right{background:var(--good);border-color:var(--good);color:#fff;animation:pop .4s ease}
.choice.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.choice.dim{opacity:.45}
.choice.right .k,.choice.wrong .k{background:rgba(255,255,255,.2);border-color:transparent;color:#fff}
@keyframes pop{50%{transform:scale(1.04)}}
.feedback{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--bg);display:none}
.feedback.on{display:block;animation:enter .3s ease both}
.feedback .verdict{font-weight:800;font-size:1.1rem;margin-bottom:4px}
.feedback .reveal{font-size:1.05rem;margin-bottom:6px}
.feedback .reveal b{color:var(--pink);font-weight:800;font-size:1.15em}
.feedback .fact{color:var(--muted);margin:0}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-weight:800;font-size:1.08rem;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.plus{position:absolute;right:18px;top:14px;font-weight:800;font-size:1.4rem;color:var(--good);pointer-events:none;animation:rise 1s ease forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}

/* Fin */
.end{text-align:center}
.big{font-size:clamp(3.4rem,15vw,5rem);font-weight:800;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.rank{font-size:1.35rem;font-weight:800;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 6px}
.record{display:inline-block;margin-top:8px;padding:6px 14px;border-radius:999px;background:var(--sun);color:#19164A;font-weight:800;animation:pulse .8s ease 2}
.review{text-align:left;margin-top:24px}
.review h2{font-size:1.1rem;margin:0 0 10px}
.review li{margin-bottom:10px;color:var(--muted)}
.review li strong{color:var(--ink)}
.review ul{padding-left:20px;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{margin-top:20px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:18px}
@media (hover:none){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<main class="wrap">

  <section id="home" class="screen on">
    <div class="hero">
      <div class="tiles" id="logo"></div>
      <p>10 questions, 15 secondes chacune. Plus tu réponds vite et sans erreur, plus ça rapporte.</p>
    </div>
    <div class="modes">
      <button class="mode" data-mode="acro"><span class="emo">🔤</span><div><strong>Acronymes</strong><span>HDMI, USB, LASER, SAMU… tu sais vraiment ce que ça veut dire ?</span></div><span class="best" data-best="acro"></span></button>
      <button class="mode" data-mode="cg"><span class="emo">🌍</span><div><strong>Culture générale</strong><span>Géo, histoire, sciences, arts, lettres, sport… près de 100 questions</span></div><span class="best" data-best="cg"></span></button>
      <button class="mode" data-mode="mix"><span class="emo">🎲</span><div><strong>Mélange</strong><span>Un peu des deux, au hasard</span></div><span class="best" data-best="mix"></span></button>
    </div>
    <p class="hint">Astuce : touches 1 à 4 pour répondre, Entrée pour continuer.</p>
  </section>

  <section id="game" class="screen">
    <div class="hud">
      <button class="quit" id="quit" aria-label="Quitter la partie">✕ Quitter</button>
      <span class="streak" id="streak">🔥 0</span>
      <span class="score" id="score">0</span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="card" id="card">
      <div id="qhead"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <div class="reveal" id="reveal"></div>
        <p class="fact" id="fact"></p>
      </div>
    </div>
    <button class="btn" id="next" hidden>Question suivante</button>
  </section>

  <section id="end" class="screen end">
    <div class="tiles" id="endTiles"></div>
    <div class="big" id="endScore">0</div>
    <div class="sub">points</div>
    <div class="rank" id="rank"></div>
    <p class="sub" id="endSub"></p>
    <div id="recordWrap"></div>
    <div class="row">
      <button class="btn" id="again">Rejouer</button>
      <button class="btn ghost" id="menu">Changer de mode</button>
    </div>
    <div class="review" id="review"></div>
  </section>

</main>

// ---------- Utilitaires ----------
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => s.replace(/[\[\]]/g, "");
const highlight = s => esc(s).replace(/\[(.+?)\]/g, "<b>$1</b>");
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const KEYS = ["A","B","C","D"];
const DURATION = 15000, NB = 10;

function tiles(el, word, delayStep = 90) {
  el.innerHTML = "";
  [...word].forEach((ch, i) => {
    const t = document.createElement("span");
    t.className = ch === " " ? "tile gap" : "tile";
    t.textContent = ch === " " ? "" : ch;
    t.style.animationDelay = (i * delayStep) + "ms";
    el.appendChild(t);
  });
}

// ---------- Confettis ----------
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function confetti(n = 70) {
  if (reduced) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  const colors = ["#3B2EF0","#FF4D8D","#FFC93C","#14A862","#6F64FF"];
  for (let i = 0; i < n; i++) parts.push({
    x: cv.width / 2 + (Math.random() - .5) * cv.width * .3, y: cv.height * .45,
    vx: (Math.random() - .5) * 18 * devicePixelRatio, vy: (-Math.random() * 16 - 6) * devicePixelRatio,
    s: (6 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: colors[i % colors.length], life: 0
  });
  if (!raf) tick();
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .5 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height + 40 && p.life < 240);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,cv.width,cv.height), null);
}

// ---------- État ----------
let S = null, timerId = null;

function buildQuestions(mode) {
  const acro = ACRO.map(x => ({ kind:"acro", tag:x.a, prompt:"Que signifie " + x.a + " ?", right:strip(x.r), reveal:x.r, wrong:x.w, fact:x.f }));
  const cg = CG.map(x => ({ kind:"cg", emo:x.c, cat:x.k, prompt:x.q, right:x.r, wrong:x.w, fact:x.f }));
  let pool;
  if (mode === "acro") pool = shuffle(acro).slice(0, NB);
  else if (mode === "cg") pool = shuffle(cg).slice(0, NB);
  else pool = shuffle([...shuffle(acro).slice(0, NB/2), ...shuffle(cg).slice(0, NB/2)]);
  return pool.map(q => { const choices = shuffle([q.right, ...q.wrong]); return { ...q, choices, ans: choices.indexOf(q.right) }; });
}

function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id)); scrollTo(0, 0); }

function refreshBest() {
  document.querySelectorAll("[data-best]").forEach(el => {
    const b = store.get("quizcult-best-" + el.dataset.best);
    el.textContent = b ? "🏆 " + b : "";
  });
}

function start(mode) {
  S = { mode, qs: buildQuestions(mode), i: 0, score: 0, streak: 0, bestStreak: 0, good: 0, results: [], misses: [], locked: false };
  $("#dots").innerHTML = S.qs.map(() => "<i></i>").join("");
  $("#score").textContent = "0";
  updateStreak();
  show("game");
  renderQ();
}

function updateStreak(hot) {
  const el = $("#streak");
  el.textContent = "🔥 " + S.streak;
  el.classList.remove("hot");
  if (hot) { void el.offsetWidth; el.classList.add("hot"); }
}

function multiplier() { return S.streak >= 5 ? 3 : S.streak >= 3 ? 2 : S.streak >= 2 ? 1.5 : 1; }

function renderQ() {
  const q = S.qs[S.i];
  S.locked = false;
  document.querySelectorAll("#dots i").forEach((d, k) => d.className = S.results[k] === true ? "ok" : S.results[k] === false ? "ko" : k === S.i ? "now" : "");
  const head = $("#qhead");
  if (q.kind === "acro") {
    head.innerHTML = '<div class="cat">Acronyme · question ' + (S.i + 1) + "/" + NB + '</div><div class="tiles" id="qtiles"></div><div class="q">Ça veut dire quoi ?</div>';
    tiles($("#qtiles"), q.tag);
  } else {
    head.innerHTML = '<span class="cg-emo">' + q.emo + '</span><div class="cat">' + esc(q.cat) + " · question " + (S.i + 1) + "/" + NB + '</div><div class="q">' + esc(q.prompt) + "</div>";
  }
  $("#choices").innerHTML = q.choices.map((c, k) =>
    '<button class="choice" data-k="' + k + '" style="animation-delay:' + (k * 60 + 150) + 'ms"><span class="k">' + KEYS[k] + "</span><span>" + esc(c) + "</span></button>").join("");
  $("#feedback").classList.remove("on");
  $("#next").hidden = true;
  $("#card").classList.remove("shake");
  startTimer();
}

function startTimer() {
  clearInterval(timerId);
  const bar = $("#timer i"), wrap = $("#timer");
  S.t0 = performance.now();
  wrap.classList.remove("low");
  bar.style.width = "100%";
  timerId = setInterval(() => {
    const left = Math.max(0, DURATION - (performance.now() - S.t0));
    bar.style.width = (left / DURATION * 100) + "%";
    wrap.classList.toggle("low", left < 4000);
    if (left <= 0) answer(-1);
  }, 50);
}

function answer(k) {
  if (S.locked) return;
  S.locked = true;
  clearInterval(timerId);
  const q = S.qs[S.i];
  const ok = k === q.ans;
  const left = Math.max(0, DURATION - (performance.now() - S.t0));
  const btns = document.querySelectorAll(".choice");
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === q.ans) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  let verdict;
  if (ok) {
    S.streak++; S.good++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    const pts = Math.round((100 + Math.round(left / 100)) * multiplier());
    S.score += pts;
    $("#score").textContent = S.score;
    const plus = document.createElement("span");
    plus.className = "plus"; plus.textContent = "+" + pts;
    $("#card").appendChild(plus); setTimeout(() => plus.remove(), 1000);
    verdict = ["Bien joué !","Exact !","Bravo !","Dans le mille !","Yes !"][Math.random() * 5 | 0] + (multiplier() > 1 ? "  Combo ×" + multiplier() : "");
    updateStreak(true);
    confetti(S.streak >= 3 ? 110 : 60);
    if (q.kind === "acro") document.getElementById("qtiles")?.classList.add("party");
  } else {
    S.streak = 0; updateStreak();
    verdict = k === -1 ? "Temps écoulé !" : "Raté…";
    S.misses.push(q);
    $("#card").classList.add("shake");
    if (navigator.vibrate) try { navigator.vibrate(120); } catch(e){}
  }
  S.results[S.i] = ok;
  document.querySelectorAll("#dots i")[S.i].className = ok ? "ok" : "ko";

  $("#verdict").textContent = verdict;
  $("#verdict").style.color = ok ? "var(--good)" : "var(--bad)";
  $("#reveal").innerHTML = q.kind === "acro" ? highlight(q.reveal) : "Réponse : <b>" + esc(q.right) + "</b>";
  $("#fact").textContent = q.fact;
  $("#feedback").classList.add("on");
  const nx = $("#next");
  nx.textContent = S.i === NB - 1 ? "Voir mon score" : "Question suivante";
  nx.hidden = false;
  nx.focus({ preventScroll: true });
  nx.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" });
}

function next() {
  if (S.i < NB - 1) { S.i++; renderQ(); } else finish();
}

function finish() {
  clearInterval(timerId);
  show("end");
  const g = S.good;
  const rank = g === 10 ? "Encyclopédie vivante 🧠" : g >= 8 ? "Grosse tête 🎓" : g >= 6 ? "Pas mal du tout 👍" : g >= 4 ? "Peut mieux faire 🙂" : "On retente ? 💪";
  tiles($("#endTiles"), g === 10 ? "PARFAIT" : g >= 6 ? "BRAVO" : "FINI");
  $("#rank").textContent = rank;
  $("#endSub").textContent = g + "/10 bonnes réponses · meilleure série : " + S.bestStreak;
  // compteur animé
  const el = $("#endScore"), target = S.score, t0 = performance.now(), dur = reduced ? 0 : 1100;
  (function count(t){ const p = dur ? Math.min(1, (t - t0) / dur) : 1; el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(count); })(t0);
  const key = "quizcult-best-" + S.mode, best = store.get(key) || 0;
  if (S.score > best) {
    store.set(key, S.score);
    $("#recordWrap").innerHTML = best ? '<span class="record">Nouveau record !</span>' : "";
    setTimeout(() => confetti(150), 300);
  } else {
    $("#recordWrap").innerHTML = '<p class="sub">Record : ' + best + "</p>";
    if (g >= 8) setTimeout(() => confetti(90), 300);
  }
  $("#review").innerHTML = S.misses.length
    ? "<h2>À retenir</h2><ul>" + S.misses.map(q => "<li><strong>" + (q.kind === "acro" ? esc(q.tag) + " : " + highlight(q.reveal) : esc(q.prompt) + " " + esc(q.right)) + "</strong><br>" + esc(q.fact) + "</li>").join("") + "</ul>"
    : "";
  refreshBest();
}

// ---------- Événements ----------
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
$("#choices").addEventListener("click", e => { const b = e.target.closest(".choice"); if (b) answer(+b.dataset.k); });
$("#next").addEventListener("click", next);
$("#again").addEventListener("click", () => start(S.mode));
$("#menu").addEventListener("click", () => { show("home"); tiles($("#logo"), "QUIZ"); });
$("#quit").addEventListener("click", () => { clearInterval(timerId); show("home"); tiles($("#logo"), "QUIZ"); });
document.addEventListener("keydown", e => {
  if (!$("#game").classList.contains("on")) return;
  if (!S.locked && ["1","2","3","4"].includes(e.key)) answer(+e.key - 1);
  else if (!S.locked && ["a","b","c","d"].includes(e.key.toLowerCase())) answer("abcd".indexOf(e.key.toLowerCase()));
  else if (S.locked && e.key === "Enter" && document.activeElement !== $("#next")) next();
});

tiles($("#logo"), "QUIZ", 120);
refreshBest();
</script>
</body>
</html>
