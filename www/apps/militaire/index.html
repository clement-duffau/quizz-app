<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matériel militaire du monde — fiches et quiz</title>
<meta name="mq-title" content="Matériel militaire">
<link rel="stylesheet" href="../../shared/fonts/fonts.css">
<script src="../../shared/capacitor.js"></script>
<script src="../../shared/shell.js"></script>
<style>
:root{
  --bg:#E4E8E3; --panel:#F4F6F2; --ink:#1B2730; --ink2:#4A5A63; --line:#C2CBC5;
  --accent:#1F5673; --accent-ink:#F4F6F2; --mark:#D9A21B; --mark-ink:#1B2730;
  --ok:#2A7447; --ok-bg:#DCEBE0; --bad:#A3362B; --bad-bg:#F1DAD6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181D; --panel:#1B242B; --ink:#E3E8E4; --ink2:#9FB0B8; --line:#2E3A43;
    --accent:#7DB4D2; --accent-ink:#0F171C; --mark:#E2B33A; --mark-ink:#12181D;
    --ok:#6CC58F; --ok-bg:#1E3527; --bad:#E58A7E; --bad-bg:#3B2320;
  }
}
:root[data-theme="dark"]{
  --bg:#12181D; --panel:#1B242B; --ink:#E3E8E4; --ink2:#9FB0B8; --line:#2E3A43;
  --accent:#7DB4D2; --accent-ink:#0F171C; --mark:#E2B33A; --mark-ink:#12181D;
  --ok:#6CC58F; --ok-bg:#1E3527; --bad:#E58A7E; --bad-bg:#3B2320;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

.wrap{max-width:980px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:'Archivo Narrow','Arial Narrow',system-ui,sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,44px);letter-spacing:.005em}
.sub{margin:6px 0 0;color:var(--ink2)}

.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1.5px solid var(--ink)}
.tabs button{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-1.5px;padding:10px 16px 8px;font-family:'Archivo Narrow','Arial Narrow',sans-serif;font-weight:600;font-size:20px;color:var(--ink2);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mark)}
.tabs button:hover{color:var(--ink)}

.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ink2);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.select{background:var(--panel);border:1.5px solid var(--ink2);border-radius:6px;padding:6px 10px;cursor:pointer;max-width:100%}

.opts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0 4px;color:var(--ink2);font-size:15px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--accent)}

.btn{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.actions .btn{flex:1 1 140px}

.prog{display:flex;justify-content:space-between;gap:12px;margin:18px 0 8px;color:var(--ink2);font-size:15px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* Fiche / carte */
.fcard,.qcard,.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;box-shadow:6px 6px 0 var(--line)}
.fcard{margin-top:14px;padding:26px clamp(18px,4vw,34px) 28px;border-top:10px solid var(--mark);min-height:300px;cursor:pointer}
.fcard.front{display:flex;flex-direction:column;justify-content:center;min-height:320px}
.tag{margin:0 0 8px;color:var(--ink2);font-weight:500}
.fname{font-size:clamp(34px,7vw,54px)}
.fname.small{font-size:clamp(28px,5vw,38px)}
.fhint{margin:18px 0 0;color:var(--ink2);max-width:52ch}
.fmeta{margin:6px 0 20px;color:var(--ink2);font-weight:500}
.note{margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--ink2);max-width:70ch}

/* Fiche technique */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px 26px;margin:0}
.stat{margin:0}
.stat dt{color:var(--ink2);font-size:14px}
.stat dd{margin:2px 0 0;display:flex;align-items:baseline;gap:6px}
.num{font-family:'Archivo Narrow','Arial Narrow',sans-serif;font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.unit{color:var(--ink2);font-weight:500}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transform-origin:left;animation:grow .55s ease-out both}
@keyframes grow{from{transform:scaleX(0)}}

/* Quiz */
.panel{margin-top:16px;padding:24px clamp(18px,4vw,32px)}
.panel h2{font-size:32px;margin-bottom:10px}
.panel p{max-width:62ch}
.seg{display:flex;gap:8px;margin:16px 0}
.seg .chip{min-width:56px}
.qcard{margin-top:12px;padding:24px clamp(18px,4vw,32px) 26px;border-top:10px solid var(--mark)}
.qtext{font-size:clamp(24px,4.6vw,32px);font-weight:600}
.hints{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.hints li{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 12px}
.hints b{font-family:'Archivo Narrow','Arial Narrow',sans-serif;font-size:20px;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
@media (min-width:640px){.choices{grid-template-columns:1fr 1fr}}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1.5px solid var(--ink2);border-radius:6px;padding:12px 14px;cursor:pointer;font-weight:500;min-height:54px}
.choice:hover{border-color:var(--ink)}
.choice .ix{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:600}
.choice[aria-disabled="true"]{cursor:default}
.choice[aria-disabled="true"]:hover{border-color:var(--ink2)}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.choice.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.choice.ok:hover{border-color:var(--ok)}.choice.bad:hover{border-color:var(--bad)}
.reveal{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.verdict{margin:0 0 16px;font-weight:600}
.verdict.good{color:var(--ok)}.verdict.wrong{color:var(--bad)}
.cmp{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:6px}
.cmp li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0}
.cmp li.best{font-weight:600}
.bigscore{font-family:'Archivo Narrow','Arial Narrow',sans-serif;font-weight:700;font-size:clamp(56px,14vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.missed{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.missed li{border-left:4px solid var(--bad);padding:2px 0 2px 12px}
.missed small{display:block;color:var(--ink2)}

/* Catalogue */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.search{flex:1 1 240px;background:var(--panel);border:1.5px solid var(--ink2);border-radius:6px;padding:8px 12px}
details.item{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
details.item[open]{border-color:var(--ink);border-left:6px solid var(--mark)}
details.item summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline;list-style:none}
details.item summary::-webkit-details-marker{display:none}
.dn{font-family:'Archivo Narrow','Arial Narrow',sans-serif;font-weight:700;font-size:22px}
.dm{color:var(--ink2)}
.item .body{padding:4px 14px 18px}
.empty{margin-top:22px;color:var(--ink2)}
footer{margin-top:40px;color:var(--ink2);font-size:14px;max-width:70ch}
@media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Matériel militaire du monde</h1>
    <p class="sub" id="sub"></p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Modes"></nav>
  <section class="filters" id="filters" aria-label="Filtres"></section>
  <main id="view"></main>
  <footer>Chiffres approximatifs issus de sources ouvertes. Ils varient selon la version, la configuration et la source : à vérifier avant de les utiliser comme référence.</footer>
</div>

<script>
(function(){
'use strict';

/* ---------- Définition des grandeurs ---------- */
const STATS={

  calibre_mm:{l:'Calibre',u:'mm'},

  wingspan_m:{l:'Envergure',u:'m'},
  ceiling_m:{l:'Plafond',u:'m'},
  mtow_kg:{l:'Masse max au décollage',u:'kg'},

};
const STAT_ORDER=Object.keys(STATS);
const STEM={
  year:'Année de mise en service de « {n} » ?',
  mass_t:'Masse de « {n} » ?',
  speed_kmh:'Vitesse maximale de « {n} » ?',
  speed_mach:'Vitesse maximale de « {n} » (en Mach) ?',
  speed_kn:'Vitesse maximale de « {n} » (en nœuds) ?',
  autonomy_km:'Autonomie de « {n} » ?',
  range_km:'Portée de « {n} » ?',
  crew:'Nombre de membres d’équipage de « {n} » ?',
  calibre_mm:'Calibre de l’arme principale de « {n} » ?',
  length_m:'Longueur de « {n} » ?',
  wingspan_m:'Envergure de « {n} » ?',
  ceiling_m:'Plafond de « {n} » ?',
  mtow_kg:'Masse maximale au décollage de « {n} » ?',
  payload_kg:'Charge utile de « {n} » ?',

const COUNTRIES={
  US:{n:'États-Unis',p:['US']},FR:{n:'France',p:['FR']},DE:{n:'Allemagne',p:['DE']},GB:{n:'Royaume-Uni',p:['GB']},
  RU:{n:'Russie',p:['RU']},CN:{n:'Chine',p:['CN']},KR:{n:'Corée du Sud',p:['KR']},IL:{n:'Israël',p:['IL']},
  JP:{n:'Japon',p:['JP']},IN:{n:'Inde',p:['IN']},TR:{n:'Turquie',p:['TR']},IR:{n:'Iran',p:['IR']},
  EU:{n:'Europe (multinational)',p:['EU']},
  FRDE:{n:'France / Allemagne',p:['FR','DE']},FRIT:{n:'France / Italie',p:['FR','IT']},
  FRGB:{n:'France / Royaume-Uni',p:['FR','GB']},INRU:{n:'Inde / Russie',p:['IN','RU']}
};
const COUNTRY_FILTER=['US','FR','DE','GB','RU','CN','KR','IL','JP','IN','TR','IR','EU'];

const CATS={
  'Char de combat':'Terre','Véhicule blindé':'Terre','Artillerie':'Terre','Défense sol-air':'Terre',
  'Avion de chasse':'Air','Bombardier & transport':'Air','Hélicoptère':'Air','Drone':'Air',
  'Porte-avions':'Mer','Destroyer & frégate':'Mer','Sous-marin':'Mer',
  'Missile de croisière':'Missiles','Missile antinavire':'Missiles','Missile balistique':'Missiles',
  'Missile air-air':'Missiles','Missile antichar':'Missiles'
};
const DOMS=['Terre','Air','Mer','Missiles'];

/* ---------- Données ---------- */
const D=[];
const add=(n,c,cat,s,note)=>D.push({id:D.length,n,c,cat,dom:CATS[cat],s,note:note||''});

// Terre : chars
add('M1A2 Abrams','US','Char de combat',{year:1980,mass_t:62,speed_kmh:67,autonomy_km:426,crew:4,calibre_mm:120},'Turbine à gaz de 1 500 ch. Chiffres de la version M1A2 ; l’année est celle de l’entrée en service de la famille M1.');
add('Leopard 2 (2A6)','DE','Char de combat',{year:1979,mass_t:62.3,speed_kmh:68,autonomy_km:500,crew:4,calibre_mm:120},'Canon lisse Rheinmetall L/55. Chiffres de la version 2A6 ; l’année est celle du premier Leopard 2.');
add('Leclerc','FR','Char de combat',{year:1992,mass_t:56.5,speed_kmh:71,autonomy_km:550,crew:3,calibre_mm:120},'Chargeur automatique : équipage réduit à 3.');
add('T-90M','RU','Char de combat',{year:1992,mass_t:46.5,speed_kmh:60,autonomy_km:550,crew:3,calibre_mm:125},'Chargeur automatique. L’année est celle du T-90 d’origine ; le T-90M est sa version modernisée.');
add('Challenger 2','GB','Char de combat',{year:1998,mass_t:62.5,speed_kmh:59,autonomy_km:450,crew:4,calibre_mm:120},'Canon rayé de 120 mm, rare parmi les chars occidentaux.');
add('Type 99A','CN','Char de combat',{year:2011,mass_t:58,speed_kmh:80,autonomy_km:500,crew:3,calibre_mm:125},'Version modernisée du Type 99 ; l’année est celle de la version 99A.');
add('K2 Black Panther','KR','Char de combat',{year:2014,mass_t:55,speed_kmh:70,autonomy_km:450,crew:3,calibre_mm:120},'Chargeur automatique ; suspension hydropneumatique capable de « s’agenouiller ».');
add('Merkava Mk 4','IL','Char de combat',{year:2004,mass_t:65,speed_kmh:64,autonomy_km:500,crew:4,calibre_mm:120},'Moteur à l’avant et porte arrière pour embarquer ou évacuer des soldats.');
add('Type 10','JP','Char de combat',{year:2012,mass_t:44,speed_kmh:70,crew:3,calibre_mm:120},'Chargeur automatique, suspension hydropneumatique.');
add('Arjun Mk 1','IN','Char de combat',{year:2004,mass_t:58.5,speed_kmh:67,autonomy_km:450,crew:4,calibre_mm:120},'Conçu par l’organisation indienne de R&D pour la défense (DRDO).');
// Terre : blindés
add('Puma','DE','Véhicule blindé',{year:2010,mass_t:31.5,speed_kmh:70,autonomy_km:600,crew:3,calibre_mm:30},'Véhicule de combat d’infanterie : 3 membres d’équipage + 6 fantassins. Masse de base ; jusqu’à environ 43 t avec blindage additionnel.');
add('BMP-3','RU','Véhicule blindé',{year:1990,mass_t:18.7,speed_kmh:70,autonomy_km:600,crew:3,calibre_mm:100},'Canon de 100 mm et canon coaxial de 30 mm ; amphibie ; 7 fantassins.');
add('M2 Bradley','US','Véhicule blindé',{year:1981,mass_t:30,speed_kmh:66,autonomy_km:400,crew:3,calibre_mm:25},'Canon de 25 mm ; 6 fantassins. Chiffres approximatifs (version M2A2).');
add('VBCI','FR','Véhicule blindé',{year:2008,mass_t:29,speed_kmh:100,autonomy_km:750,crew:2,calibre_mm:25},'8×8 ; équipage de 2 + 9 fantassins ; canon de 25 mm.');
// Terre : artillerie
add('CAESAR','FR','Artillerie',{year:2008,mass_t:18,speed_kmh:100,range_km:40,crew:3,calibre_mm:155},'Canon de 155 mm/52 calibres sur camion 6×6 ; environ 40 km de portée, davantage avec des munitions spéciales.');
add('PzH 2000','DE','Artillerie',{year:1998,mass_t:55.3,speed_kmh:60,range_km:30,crew:5,calibre_mm:155},'Tire 3 obus en quelques secondes ; 30 km de portée en standard, davantage avec des obus assistés.');
add('M109A7 Paladin','US','Artillerie',{year:1963,mass_t:35,speed_kmh:61,range_km:30,crew:4,calibre_mm:155},'Obusier automoteur de 155 mm ; l’année est celle du premier M109.');
add('2S19 Msta-S','RU','Artillerie',{year:1989,mass_t:42,speed_kmh:60,range_km:25,crew:5,calibre_mm:152},'Obusier automoteur de 152 mm ; environ 25 km de portée (près de 29 km avec obus assistés).');
add('K9 Thunder','KR','Artillerie',{year:1999,mass_t:47,speed_kmh:67,range_km:40,crew:5,calibre_mm:155},'Obusier automoteur de 155 mm/52 calibres, très exporté.');
add('M142 HIMARS','US','Artillerie',{year:2005,mass_t:16,speed_kmh:85,range_km:70,crew:3,calibre_mm:227},'Lance-roquettes sur camion : 6 roquettes GMLRS (environ 70 km) ou 1 missile ATACMS (environ 300 km).');
add('BM-30 Smerch','RU','Artillerie',{year:1987,mass_t:43.7,speed_kmh:60,range_km:90,crew:4,calibre_mm:300},'12 tubes de 300 mm ; 90 km de portée, davantage avec les munitions récentes.');

add('S-400 Triumf','RU','Défense sol-air',{year:2007,range_km:400},'Plusieurs missiles : de 40 km (9M96E) jusqu’à 400 km (40N6).');
add('MIM-104 Patriot','US','Défense sol-air',{year:1981,range_km:160},'Environ 160 km pour la version PAC-2 ; la version PAC-3 utilise un intercepteur à impact direct (« hit-to-kill »).');
add('SAMP/T','FRIT','Défense sol-air',{year:2010,range_km:120},'Système franco-italien tirant les missiles Aster 15 et Aster 30 (environ 120 km).');

// Air : avions de chasse
add('F-22 Raptor','US','Avion de chasse',{year:2005,speed_mach:2.25,ceiling_m:19800,mtow_kg:38000,length_m:18.9,wingspan_m:13.6,crew:1},'Furtif ; supercroisière (vol supersonique, environ Mach 1,5, sans postcombustion).');

add('F-16C Fighting Falcon','US','Avion de chasse',{year:1978,speed_mach:2,ceiling_m:15240,mtow_kg:19200,length_m:15.06,wingspan_m:9.96,crew:1},'Plus de 4 500 exemplaires produits ; l’année est celle de la famille F-16.');
add('MiG-29','RU','Avion de chasse',{year:1983,speed_mach:2.25,ceiling_m:18000,mtow_kg:18500,length_m:17.3,wingspan_m:11.4,crew:1},'Chasseur soviétique de 4e génération.');

/* ---------- Utilitaires ---------- */
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const num=v=>nf.format(v);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
function vt(k,v){
  if(k==='year')return String(v);
  if(k==='speed_mach')return 'Mach '+num(v);
  const u=STATS[k].u;return num(v)+(u?' '+u:'');
}
function valHtml(k,v){
  const u=STATS[k].u;
  if(k==='year')return `<span class="num">${v}</span>`;
  if(k==='speed_mach')return `<span class="unit">Mach</span><span class="num">${num(v)}</span>`;
  return `<span class="num">${num(v)}</span>${u?`<span class="unit">${u}</span>`:''}`;
}
const cname=it=>COUNTRIES[it.c].n;
const inCountry=(it,cc)=>!cc||COUNTRIES[it.c].p.includes(cc);

  qz:{phase:'setup',n:10,qs:[],i:0,sel:null,score:0,missed:[]},
  cat:{q:'',sort:'nom'}

/* ---------- Fiche technique ---------- */
function peersFor(it,k){
  let p=D.filter(x=>x.cat===it.cat&&k in x.s);
  if(p.length>=3)return {p,scope:it.cat};
  p=D.filter(x=>x.dom===it.dom&&k in x.s);
  if(p.length>=3)return {p,scope:'domaine '+it.dom};
  return null;
}
function barHtml(it,k){
  if(k==='year')return '';
  const pr=peersFor(it,k);if(!pr)return '';
  const max=Math.max(...pr.p.map(x=>x.s[k]));
  const w=Math.max(3,Math.round(it.s[k]/max*100));
  return `<div class="bar" aria-hidden="true" title="Par rapport au maximum du groupe « ${esc(pr.scope)} »"><i style="width:${w}%"></i></div>`;
}
function sheet(it){
  const rows=STAT_ORDER.filter(k=>k in it.s).map(k=>
    `<div class="stat"><dt>${STATS[k].l}</dt><dd>${valHtml(k,it.s[k])}</dd>${barHtml(it,k)}</div>`).join('');
  return `<dl class="sheet">${rows}</dl>`;
}

/* ---------- Distracteurs numériques ---------- */
function decs(v){const s=String(v);const i=s.indexOf('.');return i<0?0:s.length-i-1;}
function distract(k,v){
  if(k==='year'){
    return pick([-12,-9,-7,-5,-4,-3,-2,2,3,4,5,7,9].map(o=>v+o).filter(x=>x<=2026),3);
  }
  if(k!=='speed_mach'&&Number.isInteger(v)&&v<=12){
    return pick([v-3,v-2,v-1,v+1,v+2,v+3,v+4].filter(x=>x>0),3);
  }
  const d=decs(v);
  let unit;
  if(k==='speed_mach'&&v<5)unit=0.05;
  else if(d>0)unit=Math.pow(10,-d);
  else unit=v%100===0?100:v%10===0?10:v%5===0?5:1;
  const digits=Math.max(d,unit<1?2:0);
  const seen=new Set([v]);const out=[];
  for(const f of shuffle([.5,.6,.7,.8,.87,1.15,1.3,1.5,1.75,2.2])){
    const x=Number((Math.round(v*f/unit)*unit).toFixed(digits));
    if(x<=0||seen.has(x)||Math.abs(x-v)/v<0.06)continue;
    seen.add(x);out.push(x);
    if(out.length===3)break;
  }
  return out;
}

/* ---------- Génération des questions ---------- */
function qNum(it){
  const keys=Object.keys(it.s);const k=keys[rnd(keys.length)];
  const good=it.s[k];const d=distract(k,good);
  if(d.length<3)return null;
  return {sig:'n|'+it.id+'|'+k,kind:'Chiffre',text:STEM[k].replace('{n}',it.n),item:it,
    choices:shuffle([{t:vt(k,good),ok:true},...d.map(x=>({t:vt(k,x)}))]),answer:vt(k,good),reveal:'sheet'};
}
function qCmp(it){
  const keys=Object.keys(it.s);const k=keys[rnd(keys.length)];
  let peers=D.filter(x=>x.cat===it.cat&&k in x.s);
  if(peers.length<4)peers=D.filter(x=>x.dom===it.dom&&k in x.s);
  if(peers.length<4)return null;
  for(let a=0;a<14;a++){
    const set=[it,...pick(peers.filter(x=>x.id!==it.id),3)];
    const dir=Math.random()<.5?'max':'min';
    const sorted=[...set].sort((x,y)=>dir==='max'?y.s[k]-x.s[k]:x.s[k]-y.s[k]);
    const gap=Math.abs(sorted[0].s[k]-sorted[1].s[k]);
    const okGap=k==='year'?gap>=1:gap/Math.abs(sorted[1].s[k]||1)>=0.05;
    if(!okGap)continue;
    const text=k==='year'
      ?(dir==='max'?'Lequel est entré en service le plus récemment ?':'Lequel est entré en service en premier ?')
      :`Lequel affiche la valeur la plus ${dir==='max'?'élevée':'faible'} pour « ${STATS[k].l} » ?`;
    return {sig:'c|'+set.map(x=>x.id).sort().join('-')+'|'+k+dir,kind:'Comparaison',text,item:sorted[0],
      choices:shuffle(set.map(x=>({t:x.n,ok:x===sorted[0]}))),answer:sorted[0].n,reveal:'list',
      list:sorted.map(x=>({n:x.n,v:vt(k,x.s[k])}))};
  }
  return null;
}
function qId(it){
  const keys=Object.keys(it.s);if(keys.length<3)return null;
  const ks=pick(keys,3).sort((a,b)=>STAT_ORDER.indexOf(a)-STAT_ORDER.indexOf(b));
  const clash=x=>ks.every(k=>x.s[k]===it.s[k]);
  let peers=D.filter(x=>x.cat===it.cat&&x.id!==it.id&&!clash(x));
  if(peers.length<3)peers=D.filter(x=>x.dom===it.dom&&x.id!==it.id&&!clash(x));
  if(peers.length<3)return null;
  return {sig:'i|'+it.id+'|'+ks.join(','),kind:it.cat,text:'De quel équipement s’agit-il ?',item:it,
    hints:ks.map(k=>({l:STATS[k].l,v:vt(k,it.s[k])})),
    choices:shuffle([{t:it.n,ok:true},...pick(peers,3).map(x=>({t:x.n}))]),answer:it.n,reveal:'sheet'};
}
function qCty(it){
  if(it.c==='EU')return null;
  const mine=COUNTRIES[it.c].p;
  const names=[...new Set(D.filter(x=>x.c!=='EU'&&COUNTRIES[x.c].p.length===1&&!COUNTRIES[x.c].p.some(p=>mine.includes(p))).map(cname))];
  if(names.length<3)return null;
  return {sig:'p|'+it.id,kind:'Origine',text:`Quel pays a conçu ou fabriqué « ${it.n} » ?`,item:it,
    choices:shuffle([{t:cname(it),ok:true},...pick(names,3).map(t=>({t}))]),answer:cname(it),reveal:'sheet'};
}
function weighted(a){const t=a.reduce((s,x)=>s+x[1],0);let r=Math.random()*t;for(const [k,w] of a){if((r-=w)<0)return k;}return a[0][0];}
function buildQuiz(n){
  const p=shuffle(pool());const qs=[];const seen=new Set();
  if(!p.length)return qs;
  let idx=0,guard=0;
  while(qs.length<n&&guard++<n*40){
    const it=p[idx++%p.length];
    const types=[['num',5],['cmp',2],['id',2]];
    if(!st.country)types.push(['cty',2]);
    const t=weighted(types);
    const q=t==='num'?qNum(it):t==='cmp'?qCmp(it):t==='id'?qId(it):qCty(it);
    if(!q||seen.has(q.sig))continue;
    seen.add(q.sig);qs.push(q);
  }
  return qs;
}

/* ---------- Rendu : fiches ---------- */
function fcStart(ids){
  const f=st.fc;
  let p=ids?ids.map(id=>D[id]):pool();
  if(!ids&&f.hideKnown)p=p.filter(it=>!known.has(it.id));
  f.deck=shuffle(p.map(it=>it.id));f.i=0;f.flipped=false;f.again=[];f.sues=0;f.started=true;
}
function viewFiches(){
  const f=st.fc;
  if(!f.started)fcStart();
  const opts=`<div class="opts">
    <label><input type="checkbox" data-c="reverse" ${f.reverse?'checked':''}> Deviner le nom à partir des chiffres</label>
    <label><input type="checkbox" data-c="hideKnown" ${f.hideKnown?'checked':''}> Masquer les fiches déjà acquises</label></div>`;
  if(!f.deck.length){
    return opts+`<p class="empty">${f.hideKnown&&pool().length?'Toutes les fiches de cette sélection sont déjà acquises.':'Aucune fiche dans cette sélection.'}</p>
      <div class="actions">${known.size?'<button class="btn" data-a="resetKnown">Réinitialiser les fiches acquises</button>':''}</div>`;
  }
  if(f.i>=f.deck.length){
    return opts+`<div class="panel"><h2>Série terminée</h2>
      <p>${f.sues} fiche${f.sues>1?'s':''} sue${f.sues>1?'s':''}, ${f.again.length} à revoir. Fiches acquises au total : ${known.size} sur ${D.length}.</p>
      <div class="actions">${f.again.length?`<button class="btn primary" data-a="redoAgain">Revoir les ${f.again.length} fiche${f.again.length>1?'s':''}</button>`:''}
      <button class="btn ${f.again.length?'':'primary'}" data-a="fcRestart">Nouvelle série</button>
      ${known.size?'<button class="btn" data-a="resetKnown">Réinitialiser les acquises</button>':''}</div></div>`;
  }
  const it=D[f.deck[f.i]];
  const pct=Math.round(f.i/f.deck.length*100);
  let card;
  if(!f.reverse&&!f.flipped){
    card=`<article class="fcard front" id="fc" tabindex="0" role="button" data-a="flip" aria-label="Retourner la fiche : ${esc(it.n)}">
      <p class="tag">${esc(it.cat)}</p><h2 class="fname">${esc(it.n)}</h2>
      <p class="fhint">Retrouver le pays, l’année et les chiffres clés, puis retourner la fiche.</p></article>`;
  }else if(!f.reverse){
    card=`<article class="fcard" id="fc" tabindex="0" role="button" data-a="flip" aria-label="Retourner la fiche">
      <h2 class="fname small">${esc(it.n)}</h2><p class="fmeta">${esc(cname(it))} — ${esc(it.cat)}</p>${sheet(it)}
      ${it.note?`<p class="note">${esc(it.note)}</p>`:''}</article>`;
  }else if(!f.flipped){
    card=`<article class="fcard" id="fc" tabindex="0" role="button" data-a="flip" aria-label="Retourner la fiche">
      <p class="tag">${esc(it.cat)}</p><h2 class="fname small">Quel équipement, et quel pays ?</h2><p class="fmeta">Retourner la fiche pour vérifier.</p>${sheet(it)}</article>`;
  }else{
    card=`<article class="fcard front" id="fc" tabindex="0" role="button" data-a="flip" aria-label="Retourner la fiche">
      <p class="tag">${esc(cname(it))} — ${esc(it.cat)}</p><h2 class="fname">${esc(it.n)}</h2>
      ${it.note?`<p class="note">${esc(it.note)}</p>`:''}</article>`;
  }
  return opts+`<div class="prog"><span>Fiche ${f.i+1} sur ${f.deck.length}</span><span>${known.size} acquise${known.size>1?'s':''} sur ${D.length}</span></div>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>${card}
    <div class="actions"><button class="btn" data-a="again">À revoir</button><button class="btn" data-a="flip">Retourner</button><button class="btn primary" data-a="know">Je le savais</button></div>
    <p class="fhint">Raccourcis : espace pour retourner, flèche gauche pour « à revoir », flèche droite pour « je le savais ».</p>`;
}

function viewQuiz(){
  const q=st.qz;
  if(q.phase==='setup'){
    const n=pool().length;
    return `<div class="panel"><h2>Quiz chiffré</h2>
      <p>Chaque question porte sur des chiffres à retenir : année de mise en service, masse, vitesse, portée, dimensions, équipage… Certaines demandent de comparer des équipements, d’autres d’identifier un équipement à partir de ses chiffres.</p>
      <p>${n?`Sélection actuelle : ${n} équipement${n>1?'s':''}.`:'Aucun équipement dans cette sélection.'}</p>
      <div class="seg" role="group" aria-label="Nombre de questions">${[10,20,30].map(v=>`<button class="chip" data-a="qn" data-v="${v}" aria-pressed="${q.n===v}">${v} questions</button>`).join('')}</div>
      <div class="actions" style="max-width:320px"><button class="btn primary" data-a="qstart" ${n?'':'disabled'}>Commencer</button></div>
      ${best?`<p class="fhint">Meilleur score : ${best} %</p>`:''}</div>`;
  }
  if(q.phase==='end'){
    const total=q.qs.length;const pct=total?Math.round(q.score/total*100):0;
    const msg=pct>=90?'Excellent : les chiffres sont bien en place.':pct>=70?'Solide. Quelques valeurs restent à fixer.':pct>=50?'Correct. Repasser par les fiches aidera sur les valeurs ratées.':'À retravailler : passer par les fiches, puis recommencer.';
    return `<div class="panel"><h2>Résultat</h2><div class="bigscore">${q.score}<span class="unit"> / ${total}</span></div>
      <p>${msg}</p>${best?`<p class="fhint">Meilleur score : ${best} %</p>`:''}
      <div class="actions"><button class="btn primary" data-a="qstart">Rejouer</button>
      ${q.missed.length?'<button class="btn" data-a="missedToCards">Revoir les erreurs en fiches</button>':''}
      <button class="btn" data-a="qsetup">Changer les réglages</button></div>
      ${q.missed.length?`<h3 style="margin-top:26px">Questions ratées</h3><ul class="missed">${q.missed.map(m=>`<li>${esc(m.text)}<small>Bonne réponse : ${esc(m.answer)}</small></li>`).join('')}</ul>`:''}</div>`;
  }
  const cur=q.qs[q.i];const answered=q.sel!==null;
  const isRight=answered&&cur.choices[q.sel].ok;
  const last=q.i===q.qs.length-1;
  const pct=Math.round(q.i/q.qs.length*100);
  let reveal='';
  if(answered){
    const body=cur.reveal==='list'
      ?`<ul class="cmp">${cur.list.map((x,i)=>`<li class="${i===0?'best':''}"><span>${esc(x.n)}</span><span>${esc(x.v)}</span></li>`).join('')}</ul>`
      :sheet(cur.item)+(cur.item.note?`<p class="note">${esc(cur.item.note)}</p>`:'');
    reveal=`<div class="reveal"><p class="verdict ${isRight?'good':'wrong'}">${isRight?'Bonne réponse.':'Mauvaise réponse.'} ${isRight?'':`La bonne réponse : ${esc(cur.answer)}.`}</p>${body}
      <div class="actions"><button class="btn primary" id="next" data-a="next">${last?'Voir le résultat':'Question suivante'}</button></div></div>`;
  }
  return `<div class="prog"><span>Question ${q.i+1} sur ${q.qs.length}</span><span>Score : ${q.score}</span></div>
    <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <article class="qcard"><p class="tag">${esc(cur.kind)}</p><h2 class="qtext">${esc(cur.text)}</h2>
    ${cur.hints?`<ul class="hints">${cur.hints.map(h=>`<li>${esc(h.l)} : <b>${esc(h.v)}</b></li>`).join('')}</ul>`:''}
    <div class="choices">${cur.choices.map((c,i)=>{
      let cls='';if(answered){if(c.ok)cls='ok';else if(i===q.sel)cls='bad';}
      return `<button class="choice ${cls}" data-a="pick" data-i="${i}" ${answered?'aria-disabled="true"':''}><span class="ix">${i+1}</span><span>${esc(c.t)}</span></button>`;}).join('')}</div>
    ${reveal}</article>`;
}

/* ---------- Rendu : catalogue ---------- */
function catList(){
  const c=st.cat;const qn=norm(c.q.trim());
  let list=pool().filter(it=>!qn||norm(it.n+' '+cname(it)+' '+it.cat).includes(qn));
  if(c.sort==='nom')list.sort((a,b)=>a.n.localeCompare(b.n,'fr'));
  else if(c.sort==='pays')list.sort((a,b)=>cname(a).localeCompare(cname(b),'fr')||a.n.localeCompare(b.n,'fr'));
  else list.sort((a,b)=>(a.s.year??9999)-(b.s.year??9999)||a.n.localeCompare(b.n,'fr'));
  if(!list.length)return '<p class="empty">Aucun équipement ne correspond à cette recherche.</p>';
  return list.map(it=>`<details class="item"><summary><span class="dn">${esc(it.n)}</span><span class="dm">${esc(cname(it))}, ${esc(it.cat)}${it.s.year?`, ${it.s.year}`:''}</span></summary>
    <div class="body">${sheet(it)}${it.note?`<p class="note">${esc(it.note)}</p>`:''}</div></details>`).join('');
}
function viewCatalogue(){
  const c=st.cat;
  return `<div class="tools"><input class="search" type="search" data-c="q" placeholder="Rechercher un nom, un pays, une catégorie" aria-label="Rechercher" value="${esc(c.q)}">
    <select class="select" data-c="sort" aria-label="Trier par"><option value="nom" ${c.sort==='nom'?'selected':''}>Trier par nom</option><option value="pays" ${c.sort==='pays'?'selected':''}>Trier par pays</option><option value="annee" ${c.sort==='annee'?'selected':''}>Trier par année</option></select></div>
    <div id="catlist">${catList()}</div>`;
}

/* ---------- Rendu global ---------- */
function render(focusId){
  renderTabs();renderFilters();
  $('view').innerHTML=st.view==='fiches'?viewFiches():st.view==='quiz'?viewQuiz():viewCatalogue();
  if(focusId){const el=$(focusId);if(el)el.focus({preventScroll:true});}
}
function resetSession(){
  st.fc.started=false;
  st.qz={phase:'setup',n:st.qz.n,qs:[],i:0,sel:null,score:0,missed:[]};
}

/* ---------- Actions ---------- */
function act(a,el){
  const f=st.fc,q=st.qz;
  switch(a){
    case 'tab':st.view=el.dataset.v;render();break;
    case 'dom':st.dom=el.dataset.v;resetSession();render();break;
    case 'flip':if(f.deck.length&&f.i<f.deck.length&&st.view==='fiches'){f.flipped=!f.flipped;render('fc');}break;
    case 'know':case 'again':
      if(st.view!=='fiches'||!f.deck.length||f.i>=f.deck.length)break;
      const id=f.deck[f.i];
      if(a==='know'){known.add(id);f.sues++;store.set('mm_known_v1',[...known]);}
      else f.again.push(id);
      f.i++;f.flipped=false;render(f.i<f.deck.length?'fc':null);break;
    case 'redoAgain':fcStart(f.again.slice());render('fc');break;
    case 'fcRestart':fcStart();render('fc');break;
    case 'resetKnown':known=new Set();store.set('mm_known_v1',[]);fcStart();render();break;
    case 'qn':q.n=+el.dataset.v;render();break;
    case 'qstart':{
      const qs=buildQuiz(q.n);
      if(!qs.length)break;
      st.qz={phase:'play',n:q.n,qs,i:0,sel:null,score:0,missed:[]};render();break;}
    case 'qsetup':st.qz={phase:'setup',n:q.n,qs:[],i:0,sel:null,score:0,missed:[]};render();break;
    case 'pick':{
      if(q.phase!=='play'||q.sel!==null)break;
      const i=+el.dataset.i;const cur=q.qs[q.i];
      if(!cur||!cur.choices[i])break;
      q.sel=i;
      if(cur.choices[i].ok)q.score++;else q.missed.push(cur);
      render('next');
      {const r=document.querySelector('.reveal');if(r&&r.scrollIntoView)r.scrollIntoView({block:'nearest'});}
      break;}
    case 'next':{
      if(q.phase!=='play'||q.sel===null)break;
      if(q.i>=q.qs.length-1){
        q.phase='end';
        const pct=Math.round(q.score/q.qs.length*100);
        if(pct>best){best=pct;store.set('mm_best_v1',best);}
      }else{q.i++;q.sel=null;}
      render();window.scrollTo({top:0});break;}
    case 'missedToCards':{
      const ids=[...new Set(q.missed.map(m=>m.item.id))];
      st.view='fiches';fcStart(ids);render('fc');break;}
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(el)act(el.dataset.a,el);
});
document.addEventListener('change',e=>{
  const t=e.target;const c=t.dataset&&t.dataset.c;if(!c)return;
  if(c==='country'){st.country=t.value;resetSession();render();}
  else if(c==='reverse'){st.fc.reverse=t.checked;st.fc.flipped=false;render();}
  else if(c==='hideKnown'){st.fc.hideKnown=t.checked;fcStart();render();}
  else if(c==='sort'){st.cat.sort=t.value;$('catlist').innerHTML=catList();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.c==='q'){st.cat.q=t.value;$('catlist').innerHTML=catList();}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.matches&&t.matches('input,select,textarea'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(st.view==='fiches'){
    if(e.key===' '||e.key==='Enter'){
      if(t.closest&&t.closest('button,summary,a'))return;
      e.preventDefault();act('flip');
    }else if(e.key==='ArrowRight')act('know');
    else if(e.key==='ArrowLeft')act('again');
  }else if(st.view==='quiz'&&st.qz.phase==='play'){
    if(e.key.length===1&&'1234'.includes(e.key))act('pick',{dataset:{i:String(+e.key-1)}});
    else if(e.key==='Enter'&&st.qz.sel!==null){
      if(t.closest&&t.closest('button'))return;
      act('next');
    }
  }
});

render();
})();
</script>
</body>
</html>
